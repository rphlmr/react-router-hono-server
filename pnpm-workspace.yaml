allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Vite+ selects the pinned pnpm version. Keep one lockfile document for Dependabot.
# https://github.com/dependabot/dependabot-core/issues/15904
pmOnFail: ignore
minimumReleaseAge: 1440
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
  "@vitest/coverage-v8": 4.1.11
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
