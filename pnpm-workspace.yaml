allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Vite+ selects the pinned pnpm version. Keep one lockfile document for Dependabot.
# https://github.com/dependabot/dependabot-core/issues/15904
pmOnFail: ignore
minimumReleaseAge: 1440
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.8.0
  "@vitest/coverage-v8": 5.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - tsrs
  - "@tsrs/*"
