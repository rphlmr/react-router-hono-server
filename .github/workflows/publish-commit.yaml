name: 🚀 pkg-pr-new
on: [pull_request]

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24"
          cache: true

      - name: 📥 Install dependencies
        run: vp install

      - name: 📋 Version packages
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            vp exec changeset version
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Check pre-release mode
        id: prerelease
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ -f ".changeset/pre.json" ]] && [[ $(cat .changeset/pre.json | jq -r '.mode') != "exit" ]]; then
            echo "mode=pre-release" >> $GITHUB_OUTPUT
            echo "📦 Building pre-release package v$VERSION"
          else
            echo "mode=stable" >> $GITHUB_OUTPUT
            echo "📦 Building stable package v$VERSION"
          fi

      - name: 🏗️ Build
        run: vp run build

      - name: 📦 Publish (${{ steps.prerelease.outputs.mode }}) v${{ steps.prerelease.outputs.version }}
        run: vp dlx pkg-pr-new publish --packageManager=pnpm
