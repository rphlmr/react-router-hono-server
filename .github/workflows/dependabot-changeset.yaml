name: Add changeset to Dependabot updates

# Dependabot PRs live in this repo, so `pull_request` gets the write token below without `pull_request_target`.
on:
  pull_request:
    types: [opened, synchronize, labeled]
    paths-ignore:
      - ".github/workflows/dependabot-changeset.yaml"

# The opened, labeled and synchronize events fire together; run them one at a time per PR so pushes don't race.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Update Dependabot PR
    runs-on: ubuntu-latest
    # Gate on the PR author, not the event actor, so `@dependabot recreate` from a maintainer still runs.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'dependencies')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      # Installs the vite-plus version from the catalog, so `vp migrate` targets the release Dependabot picked.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          run-install: false
      - name: Align Vite+ toolchain
        env:
          # Dependency scripts must not run with the write token.
          npm_config_ignore_scripts: "true"
        run: |
          vite_plus=$(sed -n 's/^  vite-plus: //p' pnpm-workspace.yaml)
          if grep -q "^  vite: npm:@voidzero-dev/vite-plus-core@${vite_plus}$" pnpm-workspace.yaml; then
            exit 0
          fi

          vp migrate --no-interactive --no-hooks --no-agent --no-editor
          # Fixtures install plain Vite as user apps do, so keep their `vite` imports.
          git checkout -- tests/fixtures
      - name: Regenerate pnpm lockfile
        run: vp install --lockfile-only --ignore-scripts
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: align Vite+ toolchain and regenerate pnpm lockfile"
          git push
      - name: Update PR
        uses: StafflinePeoplePlus/dependabot-changesets@4844c33bad364143ee39ef4150c60409f306ed21 # v0.1.5
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
