name: Add changeset to Dependabot updates

on:
  pull_request_target:
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Update Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'dependencies')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit pnpm lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile"
          git push
      - name: Check changed files
        id: changed-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate \
            --jq '.[].filename')

          if [ "$files" = ".github/workflows/dependabot-changeset.yaml" ]; then
            echo "changeset=false" >> "$GITHUB_OUTPUT"
          else
            echo "changeset=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update PR
        if: steps.changed-files.outputs.changeset == 'true'
        uses: StafflinePeoplePlus/dependabot-changesets@v0.1.5
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
