name: Publish Package to npmjs
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rphlmr'
    # npm trusted publishing is bound to this environment, which only main can deploy to.
    environment: npm-release
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⎔ Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          # Other workflows write the default-branch cache, so the release job never restores it.
          cache: false

      - name: 📥 Install dependencies
        run: vp install

      - name: ⬆️ Enable npm trusted publishing
        run: npm install -g npm@12.2.1

      - name: 🦋 Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: vp run version
          publish-script: vp run release
          pr-title: "chore: release package"
          commit-message: "chore: release package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
