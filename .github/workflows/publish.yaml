name: Publish Package to npmjs
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rphlmr'
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⎔ Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24"
          cache: true

      - name: 📥 Install dependencies
        run: vp install

      - name: ⬆️ Enable npm trusted publishing
        run: npm install -g npm@^12.0.2

      - name: 🦋 Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: vp run version
          publish-script: vp run release
          pr-title: "chore: release package"
          commit-message: "chore: release package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
