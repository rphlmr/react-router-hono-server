name: Pull request

on: pull_request

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp check

  package-types:
    name: Package and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run check
      - run: vp run test:package

  node:
    name: Node
    runs-on: ubuntu-latest
    env:
      RRHS_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run test:node

  aws:
    name: AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run test:aws

  bun:
    name: Bun
    runs-on: ubuntu-latest
    env:
      RRHS_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"
      - name: Runtime diagnostics
        run: |
          echo "Bun version: $(bun --version)"
          echo "Bun revision: $(bun --revision)"
          uname -a
      - run: vp install
      - run: vp run test:bun

  deno:
    name: Deno
    runs-on: ubuntu-latest
    env:
      CHOKIDAR_USEPOLLING: "1"
      RRHS_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: vp install
      - run: vp run test:deno

  cloudflare:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    env:
      RRHS_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run test:cloudflare
