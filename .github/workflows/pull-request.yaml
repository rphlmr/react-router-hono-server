name: 🚀 PR

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: [pull_request] # Run only on pull_request, to also get status updates in PRs. We omit push because this would run the steps two times (for push and pull_request).

permissions:
  actions: write
  contents: read
  # Required to put a comment into the pull-request
  pull-requests: write

jobs:
  lint:
    name: ⬣ Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
      - run: biome ci . --reporter=github

  typecheck:
    name: 🔎 Type check
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 👷 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🔎 Type check
        run: pnpm typecheck

  test-node:
    name: ⚡ Node Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 👷 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 📦 Build library
        run: pnpm build

      - name: ⚡ Run Node integration tests
        run: pnpm test:node

  test-bun:
    name: ⚡ Bun Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 👷 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: 🥟 Setup bun
        uses: oven-sh/setup-bun@v2

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 📦 Build library
        run: pnpm build

      - name: ⚡ Run Bun integration tests
        run: pnpm test:bun

  test-deno:
    name: ⚡ Deno Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 👷 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 📦 Build library
        run: pnpm build

      - name: ⚡ Run Deno integration tests
        run: pnpm test:deno

  test-cloudflare:
    name: ☁️ Cloudflare Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 👷 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 📦 Build library
        run: pnpm build

      - name: ☁️ Run Cloudflare integration tests
        run: pnpm test:cloudflare
