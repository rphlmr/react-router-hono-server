version: 2

# One open PR for all version updates (npm + GitHub Actions).
# Dependabot refreshes it on each run until it is merged, then opens a new one.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "cron"
      cronjob: "0 6 */2 * *"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    cooldown:
      default-days: 1
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns:
      - "*"
    cooldown:
      default-days: 1
    # Dependabot cannot update transitive deps with pnpm lockfiles.
    # Restrict updates to direct deps to avoid failing runs (e.g. vite transitive attempts).
    allow:
      - dependency-type: "direct"
    # Upgrade these together with `vp migrate` to preserve Vite+ version alignment.
    ignore:
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
    groups:
      # Security fixes (often transitive deps) can't join the multi-ecosystem group,
      # so they share one PR of their own instead of one PR per package.
      security:
        applies-to: security-updates
        patterns:
          - "*"
